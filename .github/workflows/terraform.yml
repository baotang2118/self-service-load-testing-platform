name: Terraform demo infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: loadtest-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.operation == 'apply' && 'terraform-apply' || inputs.operation == 'destroy' && 'terraform-destroy' || 'terraform-plan' }}
    defaults:
      run:
        working-directory: infra/terraform/envs/loadtest
    env:
      TF_VAR_cluster_admin_cidr: ${{ vars.CLUSTER_ADMIN_CIDR }}
      TF_VAR_operator_role_arn: ${{ vars.OPERATOR_ROLE_ARN }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_terraform_role_policy_arn: ${{ vars.TERRAFORM_ROLE_POLICY_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=loadtest/terraform.tfstate" -backend-config="region=us-east-1"

      - name: Validate Terraform
        run: terraform validate

      - name: Plan infrastructure
        if: inputs.operation == 'plan'
        run: terraform plan -input=false

      - name: Apply infrastructure
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Destroy demo stack manually
        if: inputs.operation == 'destroy'
        run: terraform destroy -input=false -auto-approve