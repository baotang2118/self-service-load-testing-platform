[project]
name = "demo-django"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["django>=5.2,<5.3", "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"items/migrations/*.py" = ["RUF012"]