[project]
name = "webapp-ticket-system"
version = "0.1.0"
description = "A Django DevOps ticket approval demo"
requires-python = ">=3.12,<3.15"
dependencies = ["django>=5.2,<5.3", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
"tickets/forms.py" = ["RUF012"]
"tickets/models.py" = ["RUF012"]
"tickets/migrations/*.py" = ["RUF012"]