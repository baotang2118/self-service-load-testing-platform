apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webapp-ticket-system.fullname" . }}-worker
  labels:
    {{- include "webapp-ticket-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "webapp-ticket-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "webapp-ticket-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "webapp-ticket-system.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "webapp-ticket-system.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "runworker"]
          env:
            {{- include "webapp-ticket-system.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
