apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "webapp-ticket-system.fullname" . }}-migrate
  labels:
    {{- include "webapp-ticket-system.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "webapp-ticket-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- include "webapp-ticket-system.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "webapp-ticket-system.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "webapp-ticket-system.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
