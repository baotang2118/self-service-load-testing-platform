image:
  repository: webapp-ticket-system
  tag: local
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1
fullnameOverride: ""

database:
  host: tickets-db-postgres
  port: 5432
  name: tickets
  user: tickets
  sslmode: prefer
  passwordSecret:
    name: tickets-db-database-credentials
    key: postgres-password

django:
  secretKeySecret:
    name: tickets-webapp-django
    key: django-secret-key
  debug: false
  allowedHosts: []

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tickets.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

migrations:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3
